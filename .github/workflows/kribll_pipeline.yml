name: Kribbl GBADW Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GBADW_USER_ID: ${{ secrets.GBADW_USER_ID }}
      LEMAN_MODEL: ${{ vars.LEMAN_MODEL || 'gpt-4o' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openai requests

      - name: GBADW pipeline (BOAMP + TED, préfiltre, Leman, Supabase)
        run: python scripts/gbadw_pipeline.py

      - name: Récap et feed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbadw-rundown
          path: |
            data/gbadw_rundown.md
            data/gbadw_feed.csv
            data/gbadw_prefiltered.csv
          if-no-files-found: warn
